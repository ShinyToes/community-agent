name: student-management-agent
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?use instance/mysql.env}
      MYSQL_DATABASE: student_management_agent
      MYSQL_USER: student_agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?use instance/mysql.env}
    volumes:
      - agent_mysql_data:/var/lib/mysql
    command: ["--log-bin-trust-function-creators=1"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  agent_mysql_data:
